<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head(${id} == null ? 'Novo técnico' : 'Editar técnico')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('tecnicos')}"></header>

<main class="container">
    <div th:replace="~{fragments/layout :: alertas}"></div>

    <div class="cabecalho">
        <h1 th:text="${id} == null ? 'Novo técnico' : 'Editar técnico'">Técnico</h1>
    </div>

    <div class="card">
        <form class="form" method="post"
              th:action="${id} == null ? @{/app/tecnicos} : @{/app/tecnicos/{id}(id=${id})}">

            <div class="campo" th:classappend="${erros['nome']} ? 'invalido'">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" maxlength="100" th:value="${form.nome()}">
                <small class="campo-erro" th:if="${erros['nome']}" th:text="${erros['nome']}"></small>
            </div>

            <div class="campo" th:classappend="${erros['email']} ? 'invalido'">
                <label for="email">E-mail</label>
                <input type="text" id="email" name="email" maxlength="120" th:value="${form.email()}">
                <small class="campo-erro" th:if="${erros['email']}" th:text="${erros['email']}"></small>
            </div>

            <div class="campo" th:classappend="${erros['perfil']} ? 'invalido'">
                <label for="perfil">Perfil</label>
                <select id="perfil" name="perfil">
                    <option th:each="p : ${perfis}" th:value="${p}" th:text="${p}"
                            th:selected="${p == form.perfil()}">TECNICO</option>
                </select>
                <small class="campo-erro" th:if="${erros['perfil']}" th:text="${erros['perfil']}"></small>
            </div>

            <div class="botoes">
                <button type="submit" class="btn">Salvar</button>
                <a class="btn secundario" th:href="@{/app/tecnicos}">Cancelar</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
