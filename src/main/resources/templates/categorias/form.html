<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head(${id} == null ? 'Nova categoria' : 'Editar categoria')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('categorias')}"></header>

<main class="container">
    <div th:replace="~{fragments/layout :: alertas}"></div>

    <div class="cabecalho">
        <h1 th:text="${id} == null ? 'Nova categoria' : 'Editar categoria'">Categoria</h1>
    </div>

    <div class="card">
        <form class="form" method="post"
              th:action="${id} == null ? @{/app/categorias} : @{/app/categorias/{id}(id=${id})}">

            <div class="campo" th:classappend="${erros['nome']} ? 'invalido'">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" maxlength="60" th:value="${form.nome()}">
                <small class="campo-erro" th:if="${erros['nome']}" th:text="${erros['nome']}"></small>
            </div>

            <div class="campo" th:classappend="${erros['descricao']} ? 'invalido'">
                <label for="descricao">Descrição <span class="dica">(opcional)</span></label>
                <textarea id="descricao" name="descricao" maxlength="255" th:text="${form.descricao()}"></textarea>
                <small class="campo-erro" th:if="${erros['descricao']}" th:text="${erros['descricao']}"></small>
            </div>

            <div class="botoes">
                <button type="submit" class="btn">Salvar</button>
                <a class="btn secundario" th:href="@{/app/categorias}">Cancelar</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
