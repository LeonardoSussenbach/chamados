<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head(${id} == null ? 'Novo cliente' : 'Editar cliente')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('clientes')}"></header>

<main class="container">
    <div th:replace="~{fragments/layout :: alertas}"></div>

    <div class="cabecalho">
        <h1 th:text="${id} == null ? 'Novo cliente' : 'Editar cliente'">Cliente</h1>
    </div>

    <div class="card">
        <form class="form" method="post"
              th:action="${id} == null ? @{/app/clientes} : @{/app/clientes/{id}(id=${id})}">

            <div class="campo" th:classappend="${erros['nome']} ? 'invalido'">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" maxlength="100" th:value="${form.nome()}">
                <small class="campo-erro" th:if="${erros['nome']}" th:text="${erros['nome']}"></small>
            </div>

            <div class="campo" th:classappend="${erros['email']} ? 'invalido'">
                <label for="email">E-mail</label>
                <input type="text" id="email" name="email" maxlength="120" th:value="${form.email()}">
                <small class="campo-erro" th:if="${erros['email']}" th:text="${erros['email']}"></small>
            </div>

            <div class="campo" th:classappend="${erros['telefone']} ? 'invalido'">
                <label for="telefone">Telefone <span class="dica">(opcional)</span></label>
                <input type="text" id="telefone" name="telefone" maxlength="20" th:value="${form.telefone()}">
                <small class="campo-erro" th:if="${erros['telefone']}" th:text="${erros['telefone']}"></small>
            </div>

            <div class="botoes">
                <button type="submit" class="btn">Salvar</button>
                <a class="btn secundario"
                   th:href="${id} == null ? @{/app/clientes} : @{/app/clientes/{id}(id=${id})}">Cancelar</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
