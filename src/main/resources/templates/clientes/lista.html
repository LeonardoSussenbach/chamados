<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Clientes')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('clientes')}"></header>

<main class="container">
    <div th:replace="~{fragments/layout :: alertas}"></div>

    <div class="cabecalho">
        <h1>Clientes</h1>
        <a class="btn" th:href="@{/app/clientes/novo}">+ Novo cliente</a>
    </div>

    <div class="card tabela-wrap">
        <table>
            <thead>
            <tr><th>Nome</th><th>E-mail</th><th>Telefone</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="c : ${clientes}">
                <td><a th:href="@{/app/clientes/{id}(id=${c.id()})}" th:text="${c.nome()}">Nome</a></td>
                <td th:text="${c.email()}">email</td>
                <td th:text="${c.telefone()}">telefone</td>
                <td class="acoes">
                    <a class="btn secundario pequeno" th:href="@{/app/clientes/{id}(id=${c.id()})}">Detalhe</a>
                    <a class="btn secundario pequeno" th:href="@{/app/clientes/{id}/editar(id=${c.id()})}">Editar</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(clientes)}">
                <td colspan="4" class="vazio">Nenhum cliente cadastrado.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
